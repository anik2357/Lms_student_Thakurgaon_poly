<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Lumen</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lms_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span> Lumen</a>
      <div class="card">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to continue to your dashboard.</p>
        <div id="notice" class="note warn" hidden style="margin-bottom:16px"></div>
        <form id="form" class="form" novalidate>
          <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
          <div id="error" class="form-error" role="alert" hidden></div>
          <button id="submit" class="btn primary block" type="submit">Sign in</button>
        </form>
        <p class="muted small" style="margin:18px 0 0">New here? <a href="/register.html">Create an account</a></p>

        <div class="demo" id="demo" hidden>
          <p class="muted small" style="margin-bottom:8px">Demo accounts (created automatically on first run):</p>
          <div class="row">
            <button class="btn small" type="button" data-fill="alice@lms.test|student123">Student</button>
            <button class="btn small" type="button" data-fill="teacher@lms.test|teacher123">Teacher</button>
            <button class="btn small" type="button" data-fill="admin@lms.test|admin123">Admin</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, getToken } from "/js/api.js";
    import { saveSession, homeFor } from "/js/auth.js";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    if (params.get("expired")) {
      $("notice").textContent = "Your session expired. Please sign in again.";
      $("notice").hidden = false;
    }
    if (params.get("registered")) {
      $("notice").textContent = "Account created. Sign in to continue.";
      $("notice").hidden = false;
    }

    // Already signed in? Skip the form.
    if (getToken()) {
      api("/auth/me").then((u) => location.replace(homeFor(u.role))).catch(() => {});
    }

    // Demo shortcuts are shown only on localhost; remove this block for production.
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      $("demo").hidden = false;
      document.querySelectorAll("[data-fill]").forEach((b) =>
        b.addEventListener("click", () => {
          const [email, password] = b.dataset.fill.split("|");
          $("email").value = email;
          $("password").value = password;
        })
      );
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("submit");
      $("error").hidden = true;
      if (!$("email").value.trim() || !$("password").value) {
        $("error").textContent = "Enter your email and password.";
        $("error").hidden = false;
        return;
      }
      btn.disabled = true;
      btn.classList.add("loading");
      try {
        const session = await api("/auth/login", {
          method: "POST",
          body: { email: $("email").value.trim(), password: $("password").value },
        });
        saveSession(session);
        location.href = homeFor(session.user.role);
      } catch (err) {
        $("error").textContent = err.message;
        $("error").hidden = false;
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
